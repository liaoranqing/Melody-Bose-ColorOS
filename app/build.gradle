plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tosasitill.az100'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tosasitill.az100'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '1.3.3-fix6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    compileOnly('de.robv.android.xposed:api:82') {
        transitive = false
    }
}
