plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tosasitill.bosemelody'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tosasitill.bosemelody'
        minSdk 29
        targetSdk 35
        versionCode 24
        versionName '1.6.0'
    }

    buildFeatures {
        // MainActivity shows BuildConfig.VERSION_NAME on the about card;
        // AGP 9 no longer generates BuildConfig unless this is opted in.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // LSPosed modules are sideloaded; sign with the local debug key so
            // the release APK installs directly without manual signing.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly('de.robv.android.xposed:api:82') {
        transitive = false
    }
}
