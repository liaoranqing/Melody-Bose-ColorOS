name: Build Bose ColorOS Module

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '9.3.1'
          gradle-home-cache-cleanup: true

      - name: Run Bose BMAP codec self-test
        run: |
          mkdir -p /tmp/bose-test-classes
          javac -d /tmp/bose-test-classes \
            app/src/main/java/com/tosasitill/az100/BoseBmap.java \
            app/src/main/java/com/tosasitill/az100/BoseBmapTest.java
          java -cp /tmp/bose-test-classes com.tosasitill.az100.BoseBmapTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bose-coloros-module-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
