name: Build Bose ColorOS Module

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action accepts SDK licenses and installs platform-tools.
          # Do not request the deprecated `tools` package. API 36 is used
          # because Android 17's preview SDK package is not available here.
          packages: ''

      - name: Install Android SDK platform 36
        shell: bash
        run: sdkmanager --install "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'

      - name: Run Bose BMAP codec self-test
        run: |
          mkdir -p /tmp/bose-test-classes
          javac -d /tmp/bose-test-classes \
            app/src/main/java/com/tosasitill/bosemelody/BoseBmap.java \
            app/src/main/java/com/tosasitill/bosemelody/BoseBmapTest.java
          java -cp /tmp/bose-test-classes com.tosasitill.bosemelody.BoseBmapTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bose-coloros-module-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: bose-coloros-module-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
