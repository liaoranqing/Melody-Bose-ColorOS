name: Build Bose ColorOS Module

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_INPUT: "无线耳机_17.6.3.apk.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform 36 and build tools
        shell: bash
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'

      - name: Run Bose BMAP codec self-test
        run: |
          mkdir -p /tmp/bose-test-classes
          javac -d /tmp/bose-test-classes \
            app/src/main/java/com/tosasitill/bosemelody/BoseBmap.java \
            app/src/main/java/com/tosasitill/bosemelody/BoseBmapTest.java
          java -cp /tmp/bose-test-classes com.tosasitill.bosemelody.BoseBmapTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bose-coloros-module-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: bose-coloros-module-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # This job is intentionally independent from the Android module build. It
  # accepts the original Melody APK as an optional workflow artifact upload,
  # then performs decode/inspection/rebuild preparation on GitHub-hosted tools.
  # Actual Bose injection remains gated until the original APK is supplied and
  # the target smali entry points are verified against that exact file.
  apk-analysis:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Apktool
        shell: bash
        run: |
          curl -L --fail --retry 3 -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.1/apktool_3.0.1.jar

      - name: Check for original Melody APK
        shell: bash
        run: |
          if [[ ! -f "$APK_INPUT" ]]; then
            echo "No $APK_INPUT in repository. Upload it as a workflow artifact/input before running this job."
            echo "This job does not silently use a local path that GitHub cannot access."
            exit 1
          fi

      - name: Decode Melody APK
        run: java -jar apktool.jar d -f "$APK_INPUT" -o melody-decoded

      - name: Archive decoded APK for local review
        uses: actions/upload-artifact@v7
        with:
          name: melody-17.6.3-decoded
          path: melody-decoded
